<title id="title">Problem 40: parallel lines cut by a transversal</title><desc id="desc">Find the alternate exterior angle x. Two parallel horizontal lines are crossed by a diagonal transversal. All angle measures are shown in their corresponding sectors. The matching parallel-arrow marks show the lines are parallel.</desc>
