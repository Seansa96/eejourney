<svg xmlns="http://www.w3.org/2000/svg" width="685" height="235" viewBox="-25 0 685 235">
  <rect x="-25" y="0" width="685" height="235" fill="white"/>
  <style>
    .w{stroke:#18324b;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lbl{font-family:Segoe UI,Arial,sans-serif;font-size:13px;fill:#0f172a}
    .b{font-weight:bold}
    .sub{font-family:Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#475569}
  </style>
  <!-- Left DC source branch (Pos 1) -->
  <line x1="90" y1="55" x2="175" y2="55" class="w"/>
  <line x1="90" y1="55" x2="90" y2="95" class="w"/>
  <circle cx="90" cy="118" r="22" class="w" fill="white"/>
  <text x="90" y="113" text-anchor="middle" class="lbl b">+</text>
  <text x="90" y="131" text-anchor="middle" class="lbl b">−</text>
  <text x="60" y="122" text-anchor="end" class="lbl b">V_0 = 15.0 V</text>
  <line x1="90" y1="140" x2="90" y2="190" class="w"/>

  <!-- Position 1 & Position 2 terminals -->
  <circle cx="175" cy="55" r="4.5" fill="white" stroke="#0284c7" stroke-width="2.2"/>
  <text x="175" y="38" text-anchor="middle" class="lbl b" fill="#0284c7">Pos 1 (0 ≤ t &lt; 2.00 s)</text>
  <circle cx="175" cy="115" r="4.5" fill="white" stroke="#dc2626" stroke-width="2.2"/>
  <text x="186" y="128" text-anchor="start" class="lbl b" fill="#dc2626">Pos 2 (t ≥ 2.00 s)</text>
  <line x1="175" y1="119.5" x2="175" y2="190" class="w"/>

  <!-- Switch pivot at node S (235, 75) -->
  <circle cx="235" cy="75" r="4.5" fill="#18324b"/>
  <line x1="235" y1="75" x2="180" y2="57" stroke="#0284c7" stroke-width="2.8"/>
  <line x1="235" y1="75" x2="180" y2="112" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="238" y="62" class="lbl b">Switch S</text>

  <!-- Resistor R = 50.0 kOhm -->
  <line x1="235" y1="75" x2="295" y2="75" class="w"/>
  <polyline points="295,75 303,63 317,87 331,63 345,87 359,63 373,87 381,75" class="w"/>
  <text x="338" y="52" text-anchor="middle" class="lbl b">R = 50.0 kΩ</text>
  <line x1="381" y1="75" x2="515" y2="75" class="w"/>

  <!-- Current reference arrow i(t) -->
  <line x1="415" y1="60" x2="465" y2="60" stroke="#b91c1c" stroke-width="2.2"/>
  <polygon points="465,60 456,55 456,65" fill="#b91c1c"/>
  <text x="440" y="52" text-anchor="middle" class="lbl b" fill="#b91c1c">i(t)</text>

  <!-- Top capacitor node B -->
  <circle cx="515" cy="75" r="4" fill="#18324b"/>
  <text x="527" y="79" class="lbl b">Node B (v_C)</text>

  <!-- Capacitor C = 20.0 uF -->
  <line x1="515" y1="75" x2="515" y2="122" class="w"/>
  <line x1="490" y1="122" x2="540" y2="122" stroke="#18324b" stroke-width="3"/>
  <line x1="490" y1="136" x2="540" y2="136" stroke="#18324b" stroke-width="3"/>
  <text x="550" y="132" class="lbl b">C = 20.0 μF</text>
  <text x="482" y="114" text-anchor="end" class="lbl b" fill="#0369a1">+v_C(t)</text>
  <text x="482" y="152" text-anchor="end" class="lbl b" fill="#0369a1">−</text>
  <line x1="515" y1="136" x2="515" y2="190" class="w"/>

  <!-- Bottom ground rail -->
  <line x1="90" y1="190" x2="515" y2="190" class="w"/>
  <circle cx="175" cy="190" r="4" fill="#18324b"/>
  <line x1="300" y1="190" x2="300" y2="204" class="w"/>
  <line x1="284" y1="204" x2="316" y2="204" class="w"/>
  <line x1="290" y1="211" x2="310" y2="211" class="w"/>
  <line x1="295" y1="218" x2="305" y2="218" class="w"/>
  <text x="325" y="213" class="sub">Ground (0 V)</text>
</svg>