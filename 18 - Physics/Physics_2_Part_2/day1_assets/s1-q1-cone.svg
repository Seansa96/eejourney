<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18324b"/>
    </marker>
  </defs>
  <!-- Axis -->
  <line x1="60" y1="115" x2="585" y2="115" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="598" y="119" font-family="Segoe UI, Arial" font-size="14" font-style="italic" fill="#18324b">x</text>
  <!-- Conical body -->
  <polygon points="110,75 490,40 490,190 110,155" fill="#f1f5f9" stroke="#18324b" stroke-width="2"/>
  <!-- Left end ellipse (x = 0, radius a) -->
  <ellipse cx="110" cy="115" rx="16" ry="40" fill="#e2e8f0" stroke="#18324b" stroke-width="2"/>
  <!-- Right end ellipse (x = L, radius b) -->
  <ellipse cx="490" cy="115" rx="24" ry="75" fill="#e2e8f0" stroke="#18324b" stroke-width="2"/>
  <!-- Differential slab at x of thickness dx -->
  <polygon points="285,59 310,56.5 310,173.5 285,171" fill="#bae6fd" fill-opacity="0.65" stroke="#0284c7" stroke-width="1.8"/>
  <ellipse cx="285" cy="115" rx="19" ry="56" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,2"/>
  <ellipse cx="310" cy="115" rx="20" ry="58.5" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <!-- Radius labels a, r(x), b -->
  <line x1="110" y1="115" x2="110" y2="75" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="97" y="98" font-family="Segoe UI, Arial" font-size="14" font-style="italic" fill="#0f172a">a</text>
  <line x1="285" y1="115" x2="285" y2="59" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="250" y="90" font-family="Segoe UI, Arial" font-size="13" font-style="italic" fill="#0369a1">r(x)</text>
  <line x1="490" y1="115" x2="490" y2="40" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="500" y="82" font-family="Segoe UI, Arial" font-size="14" font-style="italic" fill="#0f172a">b</text>
  <!-- dx and x dimension lines -->
  <line x1="285" y1="36" x2="310" y2="36" stroke="#0369a1" stroke-width="1.5"/>
  <text x="290" y="28" font-family="Segoe UI, Arial" font-size="13" font-style="italic" fill="#0369a1">dx</text>
  <line x1="110" y1="205" x2="490" y2="205" stroke="#18324b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="295" y="222" font-family="Segoe UI, Arial" font-size="14" font-style="italic" fill="#18324b">L</text>
  <text x="98" y="176" font-family="Segoe UI, Arial" font-size="12" fill="#334155">x = 0</text>
  <text x="476" y="202" font-family="Segoe UI, Arial" font-size="12" fill="#334155">x = L</text>
  <!-- Current arrow -->
  <line x1="45" y1="115" x2="88" y2="115" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="58" y="105" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#b91c1c">I</text>
</svg>