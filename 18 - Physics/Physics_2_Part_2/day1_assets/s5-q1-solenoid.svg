<svg xmlns="http://www.w3.org/2000/svg" width="640" height="195" viewBox="0 0 640 195">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18324b"/>
    </marker>
  </defs>
  <style>.lbl{font-family:Segoe UI,Arial,sans-serif;font-size:12.5px;fill:#0f172a}.b{font-weight:bold}</style>
  <!-- Solenoid body -->
  <rect x="110" y="45" width="420" height="95" fill="#f0f9ff" stroke="#18324b" stroke-width="2"/>
  <!-- Cross-section ellipse -->
  <ellipse cx="110" cy="92.5" rx="18" ry="47.5" fill="#e0f2fe" stroke="#18324b" stroke-width="2"/>
  <ellipse cx="530" cy="92.5" rx="18" ry="47.5" fill="#e0f2fe" stroke="#18324b" stroke-width="2"/>
  <text x="110" y="96" text-anchor="middle" class="lbl b">Area A</text>
  <!-- Top current-out dots & bottom current-in crosses -->
  <g fill="#18324b" stroke="#18324b">
    <circle cx="155" cy="45" r="3.5"/><circle cx="205" cy="45" r="3.5"/><circle cx="255" cy="45" r="3.5"/><circle cx="305" cy="45" r="3.5"/><circle cx="355" cy="45" r="3.5"/><circle cx="405" cy="45" r="3.5"/><circle cx="455" cy="45" r="3.5"/><circle cx="500" cy="45" r="3.5"/>
    <circle cx="155" cy="140" r="3.5"/><circle cx="205" cy="140" r="3.5"/><circle cx="255" cy="140" r="3.5"/><circle cx="305" cy="140" r="3.5"/><circle cx="355" cy="140" r="3.5"/><circle cx="405" cy="140" r="3.5"/><circle cx="455" cy="140" r="3.5"/><circle cx="500" cy="140" r="3.5"/>
  </g>
  <!-- Uniform interior magnetic field lines B -->
  <line x1="140" y1="70" x2="505" y2="70" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrB)"/>
  <line x1="140" y1="90" x2="505" y2="90" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrB)"/>
  <line x1="140" y1="110" x2="505" y2="110" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="320" y="131" text-anchor="middle" class="lbl b" fill="#0284c7">Uniform Interior Field B = μ_0 (N/ℓ) I</text>
  <!-- Amperian rectangle -->
  <rect x="230" y="18" width="160" height="58" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="310" y="13" text-anchor="middle" class="lbl b" fill="#dc2626">Amperian Loop (B_out ≈ 0)</text>
  <!-- Length dimension -->
  <line x1="110" y1="168" x2="530" y2="168" stroke="#18324b" stroke-width="1.6" marker-start="url(#arrD)" marker-end="url(#arrD)"/>
  <text x="320" y="185" text-anchor="middle" class="lbl b">Solenoid Length ℓ, Total Turns N, Current I</text>
</svg>